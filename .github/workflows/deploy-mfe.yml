name: Deploy Host Shell App

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Packages
        run: |
          echo "@takedemotest:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Host App
        run: |
          # Changed base-href to root '/' for takedemotest.github.io
          npm run build -- --base-href=/

      - name: Create .nojekyll File
        run: |
          touch dist/takedemotest.github.io/.nojekyll || true
          touch dist/takedemotest.github.io/browser/.nojekyll || true

      - name: Verify build output
        run: |
          echo "Listing build output..."
          ls -R dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/takedemotest.github.io/browser
          clean: true
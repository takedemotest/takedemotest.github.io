<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KRISHITO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="public/favicon.ico"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@100..800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<!-- Redirect trick: runs when index.html is loaded AS 404.html by GitHub Pages -->
  <script type="text/javascript">
    (function() {
      var segmentCount = 0; // root domain deploy, keep as 0
      var l = window.location;
      if (l.pathname === '/' || l.pathname === '/index.html') return; // don't redirect on real home page
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }());
  </script>

  <!-- Un-redirect: runs on real index.html load, restores the clean URL -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
